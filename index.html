<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Страница только передаёт code и state в приложение: внешних ресурсов и секретов нет. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-BkzAVZEYJelq5gqyjzjuEblpJHkstGNuZobl+y7Z3nI='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Reels Studio</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f8; --fg: #16161a; --muted: #6b6b76; --accent: #7c5cff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0e12; --fg: #f2f2f5; --muted: #9a9aa6; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 420px; padding: 24px 16px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    a.button { display: inline-block; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Возвращаемся в Reels Studio…</h1>
    <p id="text">Если приложение не открылось само, нажмите кнопку.</p>
    <a id="open" class="button" href="#" hidden>Открыть Reels Studio</a>
  </main>
  <script>
    (function () {
      // Схема регистрируется приложением через плагин deep-link.
      var SCHEME = "reels-studio://oauth";
      var params = new URLSearchParams(location.search);
      var forward = new URLSearchParams();
      // Пропускаем только ожидаемые поля и только безопасные символы.
      var allowed = { code: /^[A-Za-z0-9._\-]{1,2048}$/, state: /^[A-Za-z0-9_\-]{1,256}$/,
        error: /^[a-z_]{1,64}$/, error_reason: /^[a-z_]{1,64}$/ };
      Object.keys(allowed).forEach(function (key) {
        var value = params.get(key);
        if (value !== null && allowed[key].test(value)) forward.set(key, value);
      });
      // Код одноразовый, но всё равно убираем его из адресной строки и истории.
      history.replaceState(null, "", location.pathname);
      if (!forward.has("state") || (!forward.has("code") && !forward.has("error"))) {
        document.getElementById("title").textContent = "Нечего передавать";
        document.getElementById("text").textContent = "Откройте Reels Studio и начните подключение аккаунта заново.";
        return;
      }
      var target = SCHEME + "?" + forward.toString();
      var link = document.getElementById("open");
      link.href = target;
      link.hidden = false;
      location.replace(target);
    })();
  </script>
</body>
</html>
